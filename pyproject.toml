[project]
name = "weekly-multi-agent-reports"
version = "0.1.0"
description = "A multi-agent template for scheduled, factually-verified reports: deterministic pipeline + LLM writer + LLM fact-checker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "plotly>=5.18",
    "jinja2>=3.1",
    "jsonschema>=4.20",
    "anthropic>=0.40",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
