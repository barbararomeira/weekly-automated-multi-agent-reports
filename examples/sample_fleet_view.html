<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fleet View — Weekly Reports</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      color: #1f2937;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      line-height: 1.55;
    }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem 0; }
    h2 { font-size: 1.1rem; margin-top: 2rem; color: #374151; }
    .meta { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card {
      display: flex; align-items: center;
      padding: 1rem 1.25rem;
      border: 1px solid #e5e7eb;
      border-left-width: 6px;
      border-radius: 6px;
      margin-bottom: 1rem;
      text-decoration: none;
      color: inherit;
      transition: background-color 0.1s;
    }
    .card:hover  { background-color: #f9fafb; }
    .card .left  { flex: 1; }
    .card .right { text-align: right; color: #6b7280; font-size: 0.9rem; }
    .card .title  { font-weight: 600; }
    .card .badges { color: #6b7280; font-size: 0.85rem; margin-top: 0.25rem; }
    .empty {
      color: #6b7280;
      padding: 2rem;
      text-align: center;
      border: 1px dashed #e5e7eb;
      border-radius: 6px;
    }
    .warnings-inline {
      margin-top: 0.5rem;
      padding: 0.75rem;
      background: #fef3c7;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .warnings-inline code {
      background: #fffbeb; padding: 0.1rem 0.3rem; border-radius: 3px;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Fleet View</h1>
    <div class="meta">
      1 report
      across 1
      customer
    </div>
  </header>

  
    
      <section>
        <h2>Synthetic customer</h2>
        
          <a href="sample_dashboard.html" class="card"
             style="border-left-color: #1a9850;">
            <div class="left">
              <div class="title">🟢 Demo line — synthetic data</div>
              <div class="badges">
                status: <strong>pass</strong>
                
              </div>
              
            </div>
            <div class="right">
              Week ending 2026-05-17<br>
              Updated 2026-05-22T15:13:38
            </div>
          </a>
        
      </section>
    
  

  <footer>
    Generated 2026-05-22T15:13:38
  </footer>
</body>
</html>
